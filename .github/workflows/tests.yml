name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        dependencies: [highest]
        include:
          # Proves the constraints in composer.json actually resolve and pass,
          # not just whatever the newest releases happen to be.
          - php: '8.3'
            dependencies: lowest
    name: PHP ${{ matrix.php }} (${{ matrix.dependencies }})
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl, gd, fileinfo
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}
          composer-options: --prefer-dist

      - name: Code style
        if: matrix.php == '8.4' && matrix.dependencies == 'highest'
        run: vendor/bin/pint --test

      - name: Tests
        run: vendor/bin/phpunit
